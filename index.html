<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS DISPLAY</title>
   
   <style >

    body {

    font-family: Verdana, Geneva, Tahoma, sans-serif;
    background-color: darkgrey;
    



}

h1 {

    text-align: center;
    color: whitesmoke;
    padding:20px;
    background-color: #221f1f6b;



}

.block {

    margin: 40px;


}

.block a {

    display: block;
    padding:20px;
    background-color: gray;
    text-decoration: none;
    color: whitesmoke;
    margin: 10px;
    border: 2px solid black;
    text-align: center;
    border-radius: 10px;
    font-family:monospace;
    font-size: large;
    
    

}

.inline {

    margin:40px;
    
}


.inline p {

    display:inline;
    padding:20px;
    background-color: gray;
    text-decoration: none;
    color: whitesmoke;
    border: 2px solid black;
    text-align: center;
    border-radius: 10px;
    font-family:monospace;
    font-size: large;
    margin: 20px;


}

.inline-block {

     margin:40px;


}

.inline-block p {

    display:inline-block;
    display:inline;
    padding:20px;
    background-color: gray;
    text-decoration: none;
    color: whitesmoke;
    border: 2px solid black;
    text-align: center;
    border-radius: 10px;
    font-family:monospace;
    font-size: large;
    margin: 10px;


}

.mark {

    display: none;
}

.flex {


    
    display:flex;
    gap: 20px;
    background-color:gray ;
    height: 700px;
    align-items: center;
    justify-content: space-evenly;
    flex-direction:column;



}

.flex .card {

    background-color: white;
    width: 200px;
    height: 150px;
    text-align: center;
    padding: 10px;
    font-size: 20px;
    font-style: italic;
    border: 2px solid black;




}
    
   </style>



</head>

<body>

    <h1>DISPLAY PROPERTY</h1>
    <hr>

    <div class="block">

        <a href="#">BLOCK DISPLAY</a>
        <a href="#">BLOCK DISPLAY</a>



    </div>
    <hr>

    <div class="inline">


        <p>INLINE DISPLAY</p>
        <p>INLINE DISPLAY</p>

    </div>
    <hr>

    <div class="inline-block">
        <p>Inline Block Display</p>
        <p>Inline Block Display</p>
        <p>Inline Block Display</p>
      
    </div>

    <hr>

    <p>THIS IS DISPLAY NONE <span class ="mark"> BACUS</span> </p>
    <hr>


    <h1>DISPLAY FLEX</h1>

    <hr>

    <div class="flex">
        <div class="card">FLEX BOX</div>
        <div class="card">FLEX BOX</div>
        <div class="card">FLEX BOX</div>
    </div>
    



</body>
</html>
